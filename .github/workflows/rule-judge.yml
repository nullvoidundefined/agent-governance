# The CI rule judge (claude/enforce/judge-diff.sh): judges each pull request's
# diff against the llm-judge tier rules in claude/enforce/manifest.json. Moved
# here from a local push hook on 2026-09-18 (IAN-98), where it averaged 171 s
# per push. Other repositories reuse it through workflow_call; they get this
# repository's judge checked out beside their own code. Without the
# ANTHROPIC_API_KEY secret the job passes with a notice, matching the judge's
# fail-open posture: the deterministic gates remain the hard guarantee.
name: rule-judge

on:
  pull_request:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

# A second push supersedes the first; the older run would judge a head nobody
# will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The judge reads the checkout and nothing else.
permissions:
  contents: read

jobs:
  judge:
    name: rule-judge
    runs-on: ubuntu-latest
    steps:
      # Full history, so the pull request's base commit is present for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A caller repository has no judge of its own; fetch this repository's.
      - uses: actions/checkout@v7
        if: hashFiles('claude/enforce/judge-diff.sh') == ''
        with:
          repository: nullvoidundefined/agent-governance
          path: .agent-governance

      - name: Judge the pull request diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          judge=claude/enforce/judge-diff.sh
          [ -f "$judge" ] || judge=.agent-governance/claude/enforce/judge-diff.sh
          bash "$judge" "$BASE_SHA" "$HEAD_SHA"
