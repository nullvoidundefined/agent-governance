# Runs the hook tests, the sync test, and the translator port
# checks on Linux and on macOS (bash 3.2, the shell the hooks run under on the
# owner's machine).
name: enforce

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hook-tests:
    name: hook-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jq
        run: command -v jq || sudo apt-get install -y jq
      - name: Install the checkout at ~/.claude
        run: |
          rm -rf "$HOME/.claude"
          ln -s "$GITHUB_WORKSPACE/claude" "$HOME/.claude"
      - name: Configure a git identity for the tests
        run: |
          git config --global user.email "enforce-ci@example.invalid"
          git config --global user.name "enforce CI"
      - name: Install pytest and vitest (the tdd.sh tests drive both runners)
        run: |
          pipx install pytest==9.1.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --prefix claude/enforce --no-save --no-package-lock --legacy-peer-deps vitest@5.0.0 vite@8.2.2
      - name: Install Semgrep (the rule-pack test runs it; same version as security-ci-semgrep-requirements.txt)
        run: pipx install semgrep==1.178.0
      - name: Hook tests
        run: bash claude/enforce/tests/run-tests.sh
      - name: Sync test
        run: bash sync-tests/sync.test.sh
      - name: Translator port checks
        run: |
          node translate/codex.mjs --check
          node translate/cursor.mjs --check
