# release.yml: on a pushed vMAJOR.MINOR.PATCH tag, builds the release archive
# and its checksum with release/build-release-archive.sh and publishes both as
# a GitHub Release. site/ never ships (it is export-ignore). The only write
# permission is contents: write, held by the one job that needs it; actions
# are pinned by commit SHA.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the release archive
        run: |
          mkdir -p dist
          bash release/build-release-archive.sh "$GITHUB_REF_NAME" dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
