# ci.yml: lint and test on every pull request and on pushes to the protected
# branches. The job is named "ci" because the protect-merge ruleset requires
# a status check with exactly that context. Written by the repo-setup skill;
# edit freely once it exists, the skill never overwrites.
name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
