# nginx.conf: static server for the site build. Sends the same
# Content-Security-Policy as the page's meta tag, plus the headers a meta tag
# cannot carry (frame-ancestors, nosniff, referrer policy).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
