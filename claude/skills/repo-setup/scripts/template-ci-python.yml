# ci.yml: lint and test on every pull request and on pushes to the protected
# branches. The job is named "ci" because the protect-merge ruleset requires
# a status check with exactly that context. Written by the repo-setup skill;
# edit freely once it exists, the skill never overwrites.
name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # R-607 product-docs check: a pull request that adds a user-facing route
      # must also change the features list, a user story, and an e2e spec.
      # It needs the full history to diff against the base branch. A library
      # or tooling repository opted out with productDocs false in .enforce.json
      # has no script and skips; a missing script without that opt-out fails.
      - name: R-607 feature checklist
        if: github.event_name == 'pull_request'
        env:
          FEATURE_CHECKLIST_BASE: origin/${{ github.base_ref }}
        run: |
          if [ -f scripts/require-feature-checklist.sh ]; then
            bash scripts/require-feature-checklist.sh
          elif jq -e '.productDocs == false' .enforce.json >/dev/null 2>&1; then
            echo "R-607 feature checklist skipped: .enforce.json sets productDocs to false."
          else
            echo "scripts/require-feature-checklist.sh is missing: restore it with the repo-setup skill, or set productDocs to false in .enforce.json." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
