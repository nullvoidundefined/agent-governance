# Reports a bcrypt hash or salt generated with a literal cost below 12
# (R-109, B-5). One rule per language, each id namespaced by its language so
# no two rules in this file share an id; every finding's id still ends in
# bcrypt-weak-cost.
rules:
  - id: python.bcrypt-weak-cost
    languages: [python]
    severity: ERROR
    message: >-
      bcrypt cost $COST is below the floor of 12, which makes an offline
      brute-force of a leaked hash cheaper. Use gensalt(rounds=12) or higher,
      or the library default (R-109).
    patterns:
      - pattern-either:
          - pattern: bcrypt.gensalt(rounds=$COST, ...)
          - pattern: bcrypt.gensalt($COST, ...)
      - metavariable-comparison:
          metavariable: $COST
          comparison: $COST < 12
  - id: typescript.gensalt-default.bcrypt-weak-cost
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      bcrypt genSalt with no cost argument uses the library default of 10,
      below the floor of 12, which makes an offline brute-force of a leaked
      hash cheaper. Pass a cost of 12 or higher (R-109).
    pattern-either:
      - pattern: bcrypt.genSalt()
      - pattern: bcrypt.genSaltSync()
  - id: typescript.bcrypt-weak-cost
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      bcrypt cost $COST is below the floor of 12, which makes an offline
      brute-force of a leaked hash cheaper. Pass a cost of 12 or higher
      (R-109).
    patterns:
      - pattern-either:
          - pattern: bcrypt.hash($PASSWORD, $COST, ...)
          - pattern: bcrypt.hashSync($PASSWORD, $COST)
          - pattern: bcrypt.genSalt($COST, ...)
          - pattern: bcrypt.genSaltSync($COST, ...)
      - metavariable-comparison:
          metavariable: $COST
          comparison: $COST < 12
