# ruff-enforce.toml: bundled enforcement config for push-ruff-gate.sh, the
# Python analog of the AST-tier ESLint bundle (eslint.config.mjs). Selects only
# the codes that back manifest rules; project-level ruff configs stay untouched
# because the gate passes this file via --config, which disables discovery.
#
# Code -> rule mapping:
#   PLR2004  magic-value-comparison  -> R-324 (extract meaningful literals)
#   ANN401   any-type                -> R-329 analog (no typing.Any)
#   PGH003   blanket-type-ignore     -> R-329 analog (suppressions carry codes)
#   PGH004   blanket-noqa            -> R-329 analog (suppressions carry codes)
#   E731     lambda-assignment       -> R-326 analog (named def, never lambda-to-name)

[lint]
select = ["ANN401", "E731", "PGH003", "PGH004", "PLR2004"]

[lint.per-file-ignores]
# R-324 exempts test/fixture literals; test doubles legitimately type Any.
"**/tests/**" = ["ANN401", "PLR2004"]
"**/test_*.py" = ["ANN401", "PLR2004"]
"**/*_test.py" = ["ANN401", "PLR2004"]
"**/conftest.py" = ["ANN401", "PLR2004"]
"**/__fixtures__/**" = ["ANN401", "PLR2004"]
"**/migrations/**" = ["PLR2004"]
